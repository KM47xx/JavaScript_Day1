<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      console.log(`Cart quantity: ${cartQty}`);
    ">Show Quantity</button>

    <button onclick="
      if (cartQty + 1 > 10) {
        alert('The cart is full');
      } else {
        cartQty++;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">Add to Cart</button>

    <button onclick="
      if (cartQty + 2 > 10) {
        alert('The cart is full');
      } else {
        cartQty += 2;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">+2</button>

    <button onclick="
      if (cartQty + 3 > 10) {
        alert('The cart is full');
      } else {
        cartQty = cartQty + 3;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">+3</button>

    <button onclick="
      if (cartQty + 4 > 10) {
        alert('The cart is full');
      } else {
        cartQty += 4;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">+4</button>

    <button onclick="
      if (cartQty + 5 > 10) {
        alert('The cart is full');
      } else {
        cartQty += 5;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">+5</button>

    <button onclick="
      if (cartQty - 1 < 0) {
        alert('Not enough items in the cart');
      } else {
        cartQty--;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">Remove from cart</button>

    <button onclick="
      if (cartQty - 2 < 0) {
        alert('Not enough items in the cart');
      } else {
        cartQty -= 2;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">-2</button>

    <button onclick="
      if (cartQty - 3 < 0) {
        alert('Not enough items in the cart');
      } else {
        cartQty -= 3;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">-3</button>

    <button onclick="
      cartQty = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQty}`);
    ">Reset Cart</button>

    <script>
      let cartQty = 0;
    </script>
  </body>
</html>
