<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      console.log(`Cart quantity: ${cartQty}`);
    ">Show Quantity</button>

    <button onclick="
      if (cartQty + 1 > 10) {
        alert('The cart is full');
      } else {
        cartQty++;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">Add to Cart</button>

    <button onclick="
      if (cartQty + 2 > 10) {
        alert('The cart is full');
      } else {
        cartQty += 2;
        console.log(`Cart quantity: ${cartQty}`);
      }
    ">+2</button>

    <button onclick="
      if (cartQty + 3 > 10) {
        alert('The cart is full');
      } else {
        cartQty = cartQty + 3;
        console.log(`Cart qty: ${cartQty}`);
      }
    ">+3</button>

    <button onclick="
      if (cartQty + 4 > 10) {
        alert('The cart is full');
      } else {
        cartQty += 4;
        console.log(`Cart qty: ${cartQty}`);
      }
    ">+4</button>

    <button onclick="
      if (cartQty + 5 > 10) {
        alert('The cart is full');
      } else {
        cartQty += 5;
        console.log(`Cart qty: ${cartQty}`);
      }
    ">+5</button>

    <button onclick="
      cartQty--;
      console.log(`Cart qty: ${cartQty}`);
      ">Remove from cart</button>

    <button onclick="
      cartQty -= 2;
      console.log(`Cart qty: ${cartQty}`);
    ">-2</button>

    <button onclick="
      cartQty -= 3;
      console.log(`Cart qty: ${cartQty}`);
    ">-3</button>

    <button onclick="
      cartQty = 0;
      console.log('Cart reset');
      console.log(`Cart qty: ${cartQty}`);
    ">Reset Cart</button>

    <script>
      let cartQty = 0;
    </script>
  </body>
</html>
